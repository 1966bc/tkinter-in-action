name: tests

# The tests build real windows, so they need a display. xvfb is one, and
# the whole suite runs in it in a few seconds.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tk and a display to put windows on
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Run the tests
        run: xvfb-run -a python3 -m unittest discover -s tests -v
